name: Guardar suscripción push

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: guardar-suscripcion
  cancel-in-progress: false

jobs:
  guardar:
    if: startsWith(github.event.issue.title, '[push]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Procesar el issue
        id: proc
        working-directory: scripts
        run: node guardar-suscripcion.js
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SUB_PRIVATE_KEY: ${{ secrets.SUB_PRIVATE_KEY }}

      - name: Commit de la suscripción
        if: steps.proc.outputs.resultado == 'ok'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions/
          git commit -m "Alta de suscripción push (#${{ github.event.issue.number }})" || { echo "sin cambios"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break || sleep 5
          done

      - name: Cerrar el issue como procesado
        if: steps.proc.outputs.resultado == 'ok'
        run: gh issue close "$NUM" --comment "✅ Suscripción registrada. Ya puedes cerrar esta pestaña; empezarás a recibir los avisos."
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}

      - name: Cerrar el issue con error
        if: always() && steps.proc.outputs.resultado != 'ok'
        run: gh issue close "$NUM" --comment "⚠️ No se pudo procesar la suscripción. Abre de nuevo la app y vuelve a pulsar «Activar Recordatorios»."
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
