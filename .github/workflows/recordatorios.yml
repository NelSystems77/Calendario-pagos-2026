name: Recordatorios de pagos

on:
  schedule:
    # 12:00 UTC = 06:00 en Costa Rica. Ajusta si quieres otra hora.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Costa_Rica
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Enviar recordatorios
        working-directory: scripts
        run: node enviar-recordatorios.js
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SUB_PRIVATE_KEY: ${{ secrets.SUB_PRIVATE_KEY }}

      - name: Commit de la limpieza de suscripciones caducadas
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions/
          git commit -m "Limpieza de suscripciones caducadas" || echo "sin cambios"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push || echo "nada que empujar"
